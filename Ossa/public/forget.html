<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Ossa Dashboard | Forgot Password</title>
  <meta name="description" content="Reset your Ossa association account password"/>
  <meta name="author" content="Ohene Emmanuel Kwakye"/>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" />
  <link rel="stylesheet" href="stlyes/small.css" />
  <link rel="stylesheet" href="stlyes/form.css" />
  <link rel="stylesheet" href="stlyes/large.css" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wdth@0,99.7;1,99.7&display=swap" rel="stylesheet" />

  <!-- Pointing to a new script file for reset logic -->
  <script type="module" src="script/forgot.js"></script>
</head>

<body>
    <header class="mobile-header">
        <span class="logo-icon"><i class="fas fa-graduation-cap" aria-hidden="true"> OSSA ADMIN</i></span>
        <button id="menu-bar" aria-label="menu-bar"></button>
    </header>

    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-icon"><i class="fas fa-graduation-cap" aria-hidden="true"></i></span>
                <span>OSSA Admin</span>
            </div>
            <nav class="nav-menu">
                <ul>
                    <li><a href="index.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                    <li><a href="#"><i class="fas fa-users"></i> Members</a></li>
                    <li class="nav-separator"></li>
                    <li class="login active">
                        <a href="login.html"><i class="fas fa-sign-in-alt"></i> Login</a>
                    </li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <div class="form-container">
                <h2>Reset Password</h2>
                <p>Enter your email and a new password to regain access.</p>
            
                <form id="forgot-form">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="example@email.com" required />
                    </div>
                
                    <div class="form-group">
                        <label for="new-password">New Password</label>
                        <div class="password-container">
                            <input type="password" id="new-password" name="newPassword" placeholder="••••••••" required />
                            <span id="toggle-password" class="toggle-password"><i class="fas fa-eye"></i></span>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">Update Password</button>

                    <p class="form-footer">Remembered it? <a href="login.html">Back to Login</a></p>
                </form>

                <div id="message-box" class="hidden"></div>
            </div>
        </main>
    </div>
</body>
</html>
